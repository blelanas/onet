name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to the same PR cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  # ── Fast static checks (~1 min) ───────────────────────────────────────────
  quality:
    name: Lint, types & i18n
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Translations are built and complete (fr / ar / en)
        run: |
          npm run i18n
          if [ -n "$(git status --porcelain -- packages/shared/messages)" ]; then
            git status --short -- packages/shared/messages
            echo "::error::packages/shared/messages is out of date or missing files — run 'npm run i18n' and commit the result"
            exit 1
          fi
      - name: Database migrations match the Prisma schema
        run: npm run db:check -w @onet/api
      - name: Type check (API + web)
        run: npm run typecheck
      - name: Lint
        run: npm run lint -- --max-warnings=0
      - name: Security audit (blocks on critical)
        run: |
          npm audit --omit=dev --audit-level=critical
          npm audit --omit=dev --audit-level=high > /dev/null || echo "::warning::npm audit reports high-severity advisories in production dependencies (see 'npm audit')"

  # ── API unit + integration tests on a freshly migrated & seeded DB (~1 min) ──
  test:
    name: Unit & integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test

  # ── Production builds + browser smoke test of every role (~4 min) ─────────
  e2e:
    name: Build & end-to-end smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:./prisma/ci.db
      VITE_API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Install the browser while the apps build.
      - name: Install Chromium (background)
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then cmd="install-deps chromium"; else cmd="install --with-deps chromium"; fi
          # errexit off so the exit marker is always written, even when the installer fails.
          ( set +e; npx playwright $cmd > /tmp/pw-install.log 2>&1; echo $? > /tmp/pw-install.exit ) &

      - name: Database + demo data
        run: npm run setup

      - name: Production builds (API + web)
        run: |
          # Fail fast if the background browser install has already failed.
          if [ -f /tmp/pw-install.exit ] && [ "$(cat /tmp/pw-install.exit)" != "0" ]; then
            tail -30 /tmp/pw-install.log; echo "::error::Playwright browser install failed"; exit 1
          fi
          npm run build

      - name: Start API + web
        run: |
          (cd apps/api && PORT=4000 CORS_ORIGINS=http://localhost:4173 NODE_ENV=production node dist/index.js > /tmp/api.log 2>&1 &)
          (cd apps/web && npx vite preview --port 4173 --strictPort > /tmp/web.log 2>&1 &)
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:4000/health && curl -sf -o /dev/null http://localhost:4173/ && exit 0
            sleep 1
          done
          echo "::error::Apps did not start"; tail -50 /tmp/api.log /tmp/web.log; exit 1

      - name: Wait for Chromium
        run: |
          while [ ! -f /tmp/pw-install.exit ]; do sleep 1; done
          code="$(cat /tmp/pw-install.exit)"
          if [ "$code" != "0" ]; then tail -30 /tmp/pw-install.log; echo "::error::Playwright browser install failed"; fi
          exit "$code"

      - name: Smoke test (public site + permissions for all 7 roles)
        run: npm run test:e2e
        env:
          BASE_URL: http://localhost:4173

      - name: App logs
        if: failure()
        run: tail -200 /tmp/api.log /tmp/web.log || true
