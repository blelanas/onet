name: Keep free services alive

# Free Turso databases are archived after 10 days without activity. This pings the API
# (which wakes the free Render service) and makes it read the database every 3 days.
# Skips itself until the API_URL repository variable is set (see docs/DEPLOYMENT.md).
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    name: Ping API + database
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Ping
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then echo "::notice::API_URL not set — skipped."; exit 0; fi
          # The first request may wait ~1 min while the free instance wakes up.
          for i in 1 2 3; do
            curl -sf --max-time 90 "$API_URL/health/db" && exit 0
            sleep 20
          done
          echo "::error::$API_URL/health/db did not answer"; exit 1
