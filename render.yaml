# Render Blueprint — the ONET API on the free plan (Render dashboard → New → Blueprint → this repo).
# Secrets marked `sync: false` are entered once in the Render dashboard.
services:
  - type: web
    name: onet-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    # --include=dev: the build needs prisma/esbuild/tsx (NODE_ENV=production would skip them).
    buildCommand: npm ci --include=dev --no-audit --no-fund && npm run i18n && npm run build -w @onet/api
    # Every start (all steps idempotent): pending SQL migrations, then roles/permissions and the first
    # super administrator (from ADMIN_EMAIL / ADMIN_PASSWORD, only if that account doesn't exist yet), then the API.
    startCommand: npm run db:migrate -w @onet/api && npm run db:bootstrap -w @onet/api && npm start -w @onet/api
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # libsql://<database>-<org>.turso.io
      - key: DATABASE_AUTH_TOKEN
        sync: false # turso db tokens create <database>
      - key: CORS_ORIGINS
        sync: false # https://<project>.web.app,https://<project>.firebaseapp.com,https://<project>--pr*.web.app
      - key: ADMIN_EMAIL
        sync: false # your login e-mail for the first super administrator
      - key: ADMIN_PASSWORD
        sync: false # at least 10 characters; can be removed once you have logged in
      - key: ADMIN_NAME
        sync: false # e.g. your full name
      - key: PAYMENT_PROVIDER
        value: mock
      - key: ALLOW_MOCK_PAYMENTS
        value: "false" # "true" only for a demo: the mock provider marks every online payment as paid
